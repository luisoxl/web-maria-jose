[build]
  command = "node build-articles.js"
  publish = "."

# Cada vez que el panel "Acceso Socios" guarda un artículo nuevo,
# Netlify vuelve a ejecutar este build automáticamente y la web
# se actualiza sola en segundos, sin que nadie tenga que tocar código.

# Dominio .es -> redirige al dominio principal .com
[[redirects]]
  from = "https://mariajosejaldoabogada.es/*"
  to = "https://mariajosejaldoabogada.com/:splat"
  status = 301
  force = true

